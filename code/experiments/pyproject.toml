[project]
name = "dogwhistle-detector"
version = "0.1.0"
description = "Silent but Evolving: Detecting Emerging Dog Whistles with Semantic Drift Modeling and LLMs on Decentralized Social Media"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "accelerate>=0.26.0",
    "openai>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "langdetect>=1.0.9",
    "fast-langdetect",
    "gensim>=4.3.0",
    "fasttext>=0.9.2",
    "nltk>=3.8.0",
    "flashtext>=2.7",
    "umap-learn>=0.5.9.post2",
]

[project.optional-dependencies]
dev = ["pytest", "black", "isort", "flake8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
fast-langdetect = { git = "https://github.com/LlmKira/fast-langdetect.git" }
